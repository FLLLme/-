# ============================================================================
# Decap CMS 配置（原 Netlify CMS）
#
# 后台入口：https://www.flllme.xyz/admin/
# 本文件需与 index.html、decap-cms.js 放在同一目录，
# Decap 默认读取与页面同级的 config.yml。
#
# 语法参考：https://decapcms.org/docs/configuration-options/
# ============================================================================

# ---------------------------------------------------------------------------
# 后端：GitHub
# ---------------------------------------------------------------------------
backend:
  name: github
  # 仓库名是一个连字符，加引号避免 YAML 把它当成列表符号
  repo: 'FLLLme/-'
  branch: main

  # OAuth 代理地址（已部署的 Cloudflare Worker）。
  #
  # 为什么需要它：Decap 是纯前端应用，拿不到 GitHub 的客户端密钥，
  # 无法自行完成 OAuth 换 token 的步骤，必须由一个服务端中转。
  # 该 Worker 需实现 /auth 与 /callback 两个端点。
  #
  # 注意：这里只写到根地址，Decap 会自行拼接 /auth 与 /callback，
  # 不要手动加上 /callback 后缀，否则会拼成 /callback/callback。
  base_url: https://api.flllme.xyz

  # 自定义提交信息模板（可选，留空则用 Decap 默认值）
  commit_messages:
    create: 'cms: 新建文章「{{slug}}」'
    update: 'cms: 更新文章「{{slug}}」'
    delete: 'cms: 删除文章「{{slug}}」'
    uploadMedia: 'cms: 上传图片「{{path}}」'
    deleteMedia: 'cms: 删除图片「{{path}}」'

# ---------------------------------------------------------------------------
# 站点信息（用于生成"查看线上页面"的预览链接）
# ---------------------------------------------------------------------------
site_url: 'https://www.flllme.xyz/'
display_url: 'https://www.flllme.xyz/'
logo_url: ''

# ---------------------------------------------------------------------------
# 界面语言
# ---------------------------------------------------------------------------
locale: zh_Hans

# ---------------------------------------------------------------------------
# 文件名生成规则
# ---------------------------------------------------------------------------
# Decap 默认 encoding 为 unicode，即允许非 ASCII 字符（中文）进入文件名。
# 这里显式写出，便于理解与调整；若希望文件名只用字母数字，改为 ascii。
slug:
  encoding: 'unicode'
  clean_accents: false
  sanitize_replacement: '-'

# 发布模式：
#   simple             —— 保存即直接提交到 main（默认）
#   editorial_workflow —— 草稿 → 审核 → 发布，会产生额外的分支与 PR
publish_mode: simple

# 文章数量少时保持搜索可用；若文章很多可设为 false 以免触发 GitHub 限流
search: true

# ---------------------------------------------------------------------------
# 媒体文件（编辑器里插入图片时使用）
# ---------------------------------------------------------------------------
# 使用相对路径而非 /static/... 开头，以适配 GitHub Pages 的子路径部署
# （站点位于 https://<用户>.github.io/<仓库>/ 时，绝对路径会失效）。
media_folder: 'static/images/uploads'
public_folder: 'static/images/uploads'

# ---------------------------------------------------------------------------
# 内容集合
# ---------------------------------------------------------------------------
collections:
  - name: posts
    label: 文章
    label_singular: 文章
    description: '博客文章，以 Markdown + Front matter 存储'

    folder: content/posts
    create: true
    delete: true

    # 文件名直接取「标题的 slug」，与目录里既有的文章风格保持一致。
    # 之前用的是 '{{year}}-{{month}}-{{day}}-{{slug}}'（日期前缀模板），
    # 它取的是条目创建时间而非 date 字段，会造出「文件名日期 ≠ 正文日期」的不一致。
    slug: '{{slug}}'

    extension: md
    # 明确写成 yaml-frontmatter：分隔符固定为 --- 且只解析 YAML。
    # 裸写 frontmatter 时需要 Decap 自行探测格式，是多余的不确定性。
    format: yaml-frontmatter

    # 列表视图的显示格式
    summary: '{{title}}　·　{{date}}'
    sortable_fields: ['date', 'title', 'commit_date']

    fields:
      - label: 标题
        name: title
        widget: string
        hint: 显示在文章列表与详情页
        # 注意：folder 集合并 create: true 时必须存在名为 title 的字段，
        # 它是 Decap 识别条目的依据。

      - label: 日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        hint: 决定文章排序，格式为 YYYY-MM-DD

      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
        hint: 用于列表页的标签筛选。可以添加多个，每个标签是一个词，如「前端」「CSS」

      - label: 摘要
        name: excerpt
        widget: text
        required: false
        hint: 显示在文章列表的卡片上。留空时会自动截取正文前 110 个字

      - label: 正文
        name: body
        widget: markdown
        hint: 支持标准 Markdown 语法

  # ---------------------------------------------------------------------------
  # 作品集
  #
  # 每个作品存成一个独立的 JSON 文件（content/works/xxx.json），后台左侧会
  # 出现「作品集」栏目，可以像文章一样逐条新建、编辑、排序、删除。
  #
  # 为什么用 format: json 而不是 Markdown：
  # 作品没有正文，只有结构化字段（图片、链接、简介）。用 JSON 可以让浏览器
  # 直接解析，也避免把 JSON 塞进 front matter 那种别扭的写法。
  #
  # 发布后由 tools/sync_extras.py 汇总为 posts/works.json 供前端读取。
  # ---------------------------------------------------------------------------
  - name: works
    label: 作品集
    label_singular: 作品
    description: '首页「作品集」区块。图片建议 16:10 横幅构图'

    folder: content/works
    create: true
    delete: true

    # 文件夹集合必须有一个 title 字段作为条目标识（生成文件名、列表显示都用它）
    slug: '{{slug}}'

    extension: json
    format: json

    summary: '{{title}}'
    sortable_fields: ['order', 'date', 'title', 'commit_date']

    fields:
      - label: 作品名称
        name: title
        widget: string
        hint: 显示在封面图下方

      - label: 封面图
        name: image
        widget: image
        required: false
        hint: 点「选择文件」上传。建议 16:10（如 1600×1000），留空则显示灰色占位块

      - label: 作品链接
        name: href
        widget: string
        required: false
        hint: 填了整张卡片可点击并在新标签打开，如 https://example.com。留空则不可点击

      - label: 一句话简介
        name: summary
        widget: text
        required: false
        hint: 可选，显示在作品名称上方

      - label: 创作日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        required: false
        hint: 用于排序，新作品在前。留空则排在有日期的作品之后

      - label: 排序权重
        name: order
        widget: number
        required: false
        value_type: int
        hint: 数字越小越靠前，留空按创作日期倒序。同一权重内按日期、名称排

  # ---------------------------------------------------------------------------
  # 朋友章（友链）
  #
  # 每个友链存成一个独立的 JSON 文件（content/friends/xxx.json）。
  # 发布后由 tools/sync_extras.py 汇总为 posts/friends.json 供前端读取。
  # ---------------------------------------------------------------------------
  - name: friends
    label: 朋友章
    label_singular: 友链
    description: '首页「朋友章」区块。点网名即跳转对方站点'

    folder: content/friends
    create: true
    delete: true

    # 用 name 作为条目标识，后台列表里显示的也是网名而不是文件名
    identifier_field: name
    slug: '{{slug}}'

    extension: json
    format: json

    summary: '{{name}}'
    sortable_fields: ['order', 'name', 'commit_date']

    fields:
      - label: 网名
        name: name
        widget: string
        hint: 显示在友链列表里，也是后台的条目标识

      - label: 头像
        name: avatar
        widget: image
        required: false
        hint: 正方形头像效果最好。留空则显示灰色圆形占位

      - label: 站点地址
        name: url
        widget: string
        required: false
        hint: 填了点击网名即跳转，如 https://example.com

      - label: 网站简介
        name: desc
        widget: text
        required: false
        hint: 显示在网名下方，一句话即可

      - label: 排序权重
        name: order
        widget: number
        required: false
        value_type: int
        hint: 数字越小越靠前，留空按网名排序

