# ============================================================================
# Decap CMS 配置（原 Netlify CMS）
#
# 后台入口：https://flllme.github.io/-/admin/
# 本文件需与 index.html、decap-cms.js 放在同一目录，
# Decap 默认读取与页面同级的 config.yml。
#
# 语法参考：https://decapcms.org/docs/configuration-options/
# ============================================================================

# ---------------------------------------------------------------------------
# 后端：GitHub
# ---------------------------------------------------------------------------
backend:
  name: github
  # 仓库名是一个连字符，加引号避免 YAML 把它当成列表符号
  repo: 'FLLLme/-'
  branch: main

  # OAuth 代理地址（已部署的 Cloudflare Worker）。
  #
  # 为什么需要它：Decap 是纯前端应用，拿不到 GitHub 的客户端密钥，
  # 无法自行完成 OAuth 换 token 的步骤，必须由一个服务端中转。
  # 该 Worker 需实现 /auth 与 /callback 两个端点。
  #
  # 注意：这里只写到根地址，Decap 会自行拼接 /auth 与 /callback，
  # 不要手动加上 /callback 后缀，否则会拼成 /callback/callback。
  base_url: https://api.flllme.xyz

  # 自定义提交信息模板（可选，留空则用 Decap 默认值）
  commit_messages:
    create: 'cms: 新建文章「{{slug}}」'
    update: 'cms: 更新文章「{{slug}}」'
    delete: 'cms: 删除文章「{{slug}}」'
    uploadMedia: 'cms: 上传图片「{{path}}」'
    deleteMedia: 'cms: 删除图片「{{path}}」'

# ---------------------------------------------------------------------------
# 站点信息（用于生成"查看线上页面"的预览链接）
# ---------------------------------------------------------------------------
site_url: 'https://flllme.github.io/-/'
display_url: 'https://flllme.github.io/-/'
logo_url: ''

# ---------------------------------------------------------------------------
# 界面语言
# ---------------------------------------------------------------------------
locale: zh_Hans

# ---------------------------------------------------------------------------
# 文件名生成规则
# ---------------------------------------------------------------------------
# Decap 默认 encoding 为 unicode，即允许非 ASCII 字符（中文）进入文件名。
# 这里显式写出，便于理解与调整；若希望文件名只用字母数字，改为 ascii。
slug:
  encoding: 'unicode'
  clean_accents: false
  sanitize_replacement: '-'

# 发布模式：
#   simple             —— 保存即直接提交到 main（默认）
#   editorial_workflow —— 草稿 → 审核 → 发布，会产生额外的分支与 PR
publish_mode: simple

# 文章数量少时保持搜索可用；若文章很多可设为 false 以免触发 GitHub 限流
search: true

# ---------------------------------------------------------------------------
# 媒体文件（编辑器里插入图片时使用）
# ---------------------------------------------------------------------------
# 使用相对路径而非 /static/... 开头，以适配 GitHub Pages 的子路径部署
# （站点位于 https://<用户>.github.io/<仓库>/ 时，绝对路径会失效）。
media_folder: 'static/images/uploads'
public_folder: 'static/images/uploads'

# ---------------------------------------------------------------------------
# 内容集合
# ---------------------------------------------------------------------------
collections:
  - name: posts
    label: 文章
    label_singular: 文章
    description: '博客文章，以 Markdown + Front matter 存储'

    folder: content/posts
    create: true
    delete: true

    # 文件名直接取「标题的 slug」，与目录里既有的文章风格保持一致。
    # 之前用的是 '{{year}}-{{month}}-{{day}}-{{slug}}'（日期前缀模板），
    # 它取的是条目创建时间而非 date 字段，会造出「文件名日期 ≠ 正文日期」的不一致。
    slug: '{{slug}}'

    extension: md
    # 明确写成 yaml-frontmatter：分隔符固定为 --- 且只解析 YAML。
    # 裸写 frontmatter 时需要 Decap 自行探测格式，是多余的不确定性。
    format: yaml-frontmatter

    # 列表视图的显示格式
    summary: '{{title}}　·　{{date}}'
    sortable_fields: ['date', 'title', 'commit_date']

    fields:
      - label: 标题
        name: title
        widget: string
        hint: 显示在文章列表与详情页
        # 注意：folder 集合并 create: true 时必须存在名为 title 的字段，
        # 它是 Decap 识别条目的依据。

      - label: 日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        hint: 决定文章排序，格式为 YYYY-MM-DD

      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
        hint: 用于列表页的标签筛选。可以添加多个，每个标签是一个词，如「前端」「CSS」

      - label: 摘要
        name: excerpt
        widget: text
        required: false
        hint: 显示在文章列表的卡片上。留空时会自动截取正文前 110 个字

      - label: 正文
        name: body
        widget: markdown
        hint: 支持标准 Markdown 语法
