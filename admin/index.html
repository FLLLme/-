<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 后台不应被搜索引擎收录 -->
  <meta name="robots" content="noindex, nofollow">
  <title>内容管理 · 后台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233d5af1'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">

  <style>
    #cms-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI",
            "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #4b5563;
      background: #f6f7f9;
    }
    #cms-loading .box {
      max-width: 580px;
      padding: 28px 32px;
      border: 1px solid #e4e7ee;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(16, 24, 40, .08);
    }
    #cms-loading h1 { margin: 0 0 12px; font-size: 17px; color: #171a21; }
    #cms-loading p { margin: 0 0 10px; }
    #cms-loading code {
      padding: 2px 6px;
      border: 1px solid #e4e7ee;
      border-radius: 5px;
      background: #f2f4f7;
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: .9em;
    }
    #cms-loading .spinner {
      width: 16px; height: 16px;
      margin-right: 8px;
      vertical-align: -3px;
      border: 2px solid #d5dae4;
      border-top-color: #3d5af1;
      border-radius: 50%;
      display: inline-block;
      animation: cms-spin .8s linear infinite;
    }
    @keyframes cms-spin { to { transform: rotate(360deg); } }
    #cms-progress { font-size: 13px; color: #8b93a3; }
    #cms-error { display: none; color: #dc2626; }
    #cms-error ol, #cms-loading .box ul { margin: 8px 0 0; padding-left: 20px; }
    #cms-error li, #cms-loading .box li { margin: 4px 0; }
    #cms-loading .warn-title { color: #b45309; }
    #cms-loading .box a { color: #3d5af1; word-break: break-all; }
  </style>
</head>
<body>

<!-- 加载中 / 加载失败提示 -->
<div id="cms-loading">
  <div class="box">
    <h1><span class="spinner"></span>正在加载内容管理后台…</h1>
    <p id="cms-progress">准备中…</p>
    <div id="cms-error">
      <p><strong>Decap CMS 脚本加载失败。</strong>已尝试以下全部来源：</p>
      <ol id="cms-tried"></ol>
      <p>排查方向：</p>
      <ol>
        <li>确认本目录下存在 <code>decap-cms.js</code>（约 5 MB）。若缺失，说明上传时被跳过。</li>
        <li>打开浏览器开发者工具的 Console 与 Network 面板，查看具体报错。</li>
        <li>若只有 CDN 失败而本地文件正常，说明是网络问题，不影响使用。</li>
      </ol>
    </div>
  </div>
</div>

<script>
  /* ------------------------------------------------------------------------
     加载顺序：优先使用仓库内自托管的 decap-cms.js。
     之所以不用 CDN 打头：unpkg / jsDelivr 在国内网络下经常不可达或极慢，
     而 Decap 的包有 5 MB，一旦卡住页面会一直停在加载态。
     自托管 + CDN 兜底，两种网络环境都能工作。

     每个来源设置了超时：CDN 有时不返回错误只是长时间挂起，
     仅靠 onerror 会永远等下去。
     ------------------------------------------------------------------------ */
  var CMS_SOURCES = [
    'decap-cms.js',
    'https://registry.npmmirror.com/decap-cms/3.16.3/files/dist/decap-cms.js',
    'https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js'
  ];
  var CMS_TIMEOUT_MS = 30000;
  var tried = [];

  function label(src) {
    return src.indexOf('http') === 0 ? src : '本目录 ' + src + '（自托管）';
  }

  function showError() {
    document.getElementById('cms-progress').style.display = 'none';
    var list = document.getElementById('cms-tried');
    list.innerHTML = '';
    tried.forEach(function (t) {
      var li = document.createElement('li');
      li.textContent = label(t);
      list.appendChild(li);
    });
    document.getElementById('cms-error').style.display = 'block';
  }

  function loadCMS(i) {
    if (i >= CMS_SOURCES.length) { showError(); return; }

    var src = CMS_SOURCES[i];
    tried.push(src);
    document.getElementById('cms-progress').textContent =
      '正在从 ' + label(src) + ' 加载…（' + (i + 1) + '/' + CMS_SOURCES.length + '）';

    var done = false;
    var script = document.createElement('script');
    script.src = src;

    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      if (script.parentNode) script.parentNode.removeChild(script);
      loadCMS(i + 1);
    }, CMS_TIMEOUT_MS);

    script.onload = function () {
      if (done) return;
      done = true;
      clearTimeout(timer);
      var box = document.getElementById('cms-loading');
      if (box) box.remove();
    };

    script.onerror = function () {
      if (done) return;
      done = true;
      clearTimeout(timer);
      loadCMS(i + 1);
    };

    document.body.appendChild(script);
  }

  /* ------------------------------------------------------------------------
     前置检查：不允许用 file:// 打开。

     Decap CMS 有两条硬性依赖 HTTP 的链路：
       1. 读取同目录的 config.yml（file:// 下会被同源策略拦截）
       2. 走 GitHub OAuth 授权（需要一个可回调的 http(s) 来源）
     浏览器不会给出有用的提示，Decap 也只会抛出含糊的
     "Failed to load config.yml (Failed to fetch)"，很容易误判成配置写错了。
     所以这里提前拦截，直接给出正确地址。
     ------------------------------------------------------------------------ */
  function showFileProtocolError() {
    document.getElementById('cms-loading').innerHTML =
      '<div class="box">' +
        '<h1 class="warn-title">不能以文件方式打开此页面</h1>' +
        '<p>当前协议是 <code>file:</code>，地址为 <code>' +
          String(location.href).replace(/</g, '&lt;') + '</code>。</p>' +
        '<p>Decap CMS 必须通过 HTTP 访问：它要读取同目录的 ' +
          '<code>config.yml</code>，还要完成 GitHub 授权回调。' +
          '浏览器会拦截 <code>file://</code> 页面的这些请求，' +
          '因此必然报出 <code>Failed to load config.yml</code>。</p>' +
        '<p><strong>请改用下面任一地址打开：</strong></p>' +
        '<ul>' +
          '<li>线上后台：<a href="https://flllme.github.io/-/admin/">' +
            'https://flllme.github.io/-/admin/</a></li>' +
          '<li>本地预览：在项目目录执行 <code>python server.py</code>，' +
            '然后打开 <a href="http://127.0.0.1:8080/admin/">' +
            'http://127.0.0.1:8080/admin/</a></li>' +
        '</ul>' +
      '</div>';
  }

  if (location.protocol === 'file:') {
    showFileProtocolError();
  } else {
    loadCMS(0);
  }
</script>

<noscript>
  <p style="padding:24px;font-family:sans-serif;">
    内容管理后台需要启用 JavaScript 才能运行。
  </p>
</noscript>

</body>
</html>
