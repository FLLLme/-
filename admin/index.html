<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 后台不应被搜索引擎收录 -->
  <meta name="robots" content="noindex, nofollow">
  <title>内容管理 · 后台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233d5af1'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">

  <style>
    #cms-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI",
            "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #4b5563;
      background: #f6f7f9;
    }
    #cms-loading .box {
      max-width: 580px;
      padding: 28px 32px;
      border: 1px solid #e4e7ee;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(16, 24, 40, .08);
    }
    #cms-loading h1 { margin: 0 0 12px; font-size: 17px; color: #171a21; }
    #cms-loading p { margin: 0 0 10px; }
    #cms-loading code {
      padding: 2px 6px;
      border: 1px solid #e4e7ee;
      border-radius: 5px;
      background: #f2f4f7;
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: .9em;
    }
    #cms-loading .spinner {
      width: 16px; height: 16px;
      margin-right: 8px;
      vertical-align: -3px;
      border: 2px solid #d5dae4;
      border-top-color: #3d5af1;
      border-radius: 50%;
      display: inline-block;
      animation: cms-spin .8s linear infinite;
    }
    @keyframes cms-spin { to { transform: rotate(360deg); } }
    #cms-progress { font-size: 13px; color: #8b93a3; }
    #cms-error { display: none; color: #dc2626; }
    #cms-error ol, #cms-loading .box ul { margin: 8px 0 0; padding-left: 20px; }
    #cms-error li, #cms-loading .box li { margin: 4px 0; }
    #cms-loading .warn-title { color: #b45309; }
    #cms-loading .box a { color: #3d5af1; word-break: break-all; }
  </style>
</head>
<body>

<!-- 加载中 / 加载失败提示 -->
<div id="cms-loading">
  <div class="box">
    <h1><span class="spinner"></span>正在加载内容管理后台…</h1>
    <p id="cms-progress">准备中…</p>
    <div id="cms-error">
      <p><strong>Decap CMS 脚本加载失败。</strong>已尝试以下全部来源：</p>
      <ol id="cms-tried"></ol>
      <p>排查方向：</p>
      <ol>
        <li>确认本目录下存在 <code>decap-cms.js</code>（约 5 MB）。若缺失，说明上传时被跳过。</li>
        <li>打开浏览器开发者工具的 Console 与 Network 面板，查看具体报错。</li>
        <li>若只有 CDN 失败而本地文件正常，说明是网络问题，不影响使用。</li>
      </ol>
    </div>
  </div>
</div>

<script>
  /* ------------------------------------------------------------------------
     加载顺序：优先使用仓库内自托管的 decap-cms.js。
     之所以不用 CDN 打头：unpkg / jsDelivr 在国内网络下经常不可达或极慢，
     而 Decap 的包有 5 MB，一旦卡住页面会一直停在加载态。
     自托管 + CDN 兜底，两种网络环境都能工作。

     每个来源设置了超时：CDN 有时不返回错误只是长时间挂起，
     仅靠 onerror 会永远等下去。
     ------------------------------------------------------------------------ */
  var CMS_SOURCES = [
    'decap-cms.js',
    'https://registry.npmmirror.com/decap-cms/3.16.3/files/dist/decap-cms.js',
    'https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js'
  ];
  var CMS_TIMEOUT_MS = 30000;
  var tried = [];

  function label(src) {
    return src.indexOf('http') === 0 ? src : '本目录 ' + src + '（自托管）';
  }

  function showError() {
    document.getElementById('cms-progress').style.display = 'none';
    var list = document.getElementById('cms-tried');
    list.innerHTML = '';
    tried.forEach(function (t) {
      var li = document.createElement('li');
      li.textContent = label(t);
      list.appendChild(li);
    });
    document.getElementById('cms-error').style.display = 'block';
  }

  function loadCMS(i) {
    if (i >= CMS_SOURCES.length) { showError(); return; }

    var src = CMS_SOURCES[i];
    tried.push(src);
    document.getElementById('cms-progress').textContent =
      '正在从 ' + label(src) + ' 加载…（' + (i + 1) + '/' + CMS_SOURCES.length + '）';

    var done = false;
    var script = document.createElement('script');
    script.src = src;

    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      if (script.parentNode) script.parentNode.removeChild(script);
      loadCMS(i + 1);
    }, CMS_TIMEOUT_MS);

    script.onload = function () {
      if (done) return;
      done = true;
      clearTimeout(timer);
      var box = document.getElementById('cms-loading');
      if (box) box.remove();
    };

    script.onerror = function () {
      if (done) return;
      done = true;
      clearTimeout(timer);
      loadCMS(i + 1);
    };

    document.body.appendChild(script);
  }

  /* ------------------------------------------------------------------------
     前置检查：不允许用 file:// 打开。

     Decap CMS 有两条硬性依赖 HTTP 的链路：
       1. 读取同目录的 config.yml（file:// 下会被同源策略拦截）
       2. 走 GitHub OAuth 授权（需要一个可回调的 http(s) 来源）
     浏览器不会给出有用的提示，Decap 也只会抛出含糊的
     "Failed to load config.yml (Failed to fetch)"，很容易误判成配置写错了。
     所以这里提前拦截，直接给出正确地址。
     ------------------------------------------------------------------------ */
  function showFileProtocolError() {
    document.getElementById('cms-loading').innerHTML =
      '<div class="box">' +
        '<h1 class="warn-title">不能以文件方式打开此页面</h1>' +
        '<p>当前协议是 <code>file:</code>，地址为 <code>' +
          String(location.href).replace(/</g, '&lt;') + '</code>。</p>' +
        '<p>Decap CMS 必须通过 HTTP 访问：它要读取同目录的 ' +
          '<code>config.yml</code>，还要完成 GitHub 授权回调。' +
          '浏览器会拦截 <code>file://</code> 页面的这些请求，' +
          '因此必然报出 <code>Failed to load config.yml</code>。</p>' +
        '<p><strong>请改用下面任一地址打开：</strong></p>' +
        '<ul>' +
          '<li>线上后台：<a href="https://flllme.github.io/-/admin/">' +
            'https://flllme.github.io/-/admin/</a></li>' +
          '<li>本地预览：在项目目录执行 <code>python server.py</code>，' +
            '然后打开 <a href="http://127.0.0.1:8080/admin/">' +
            'http://127.0.0.1:8080/admin/</a></li>' +
        '</ul>' +
      '</div>';
  }

  if (location.protocol === 'file:') {
    showFileProtocolError();
  } else {
    installRawGithubFallback();
    installOAuthShim();
    loadCMS(0);
  }

  /* ==========================================================================
     raw.githubusercontent.com 请求改写层

     问题
     ----
     Decap 读取「单个条目」的内容时，走的是 GitHub Contents API 返回的
     download_url，即：

         https://raw.githubusercontent.com/{owner}/{repo}/{branch}/{path}

     这个域名在国内网络会被拦截（实测直接 Failed to fetch），于是 Decap 拿到
     空内容，解析时报 "Unrecognized front-matter format."，表现为：
     列表能正常显示标题和日期，但点开文章所有字段都是空的。

     而完整内容其实就在 Contents API 的 base64 字段里，那条路径（api.github.com）
     是通的——实测能正确解出文章原文。

     本层做的事
     ----------
     把发往 raw.githubusercontent.com 的 fetch 请求改写成 api.github.com 的
     Contents API 调用，取出 base64 内容解码后，以普通文本响应返回。
     对调用方（Decap）完全透明，它拿到的仍是一段文件文本。

     注意路径解析：仓库名是 `-`（一个连字符），所以要按「前两段是 owner/repo、
     第三段是分支、其余是文件路径」来切分，不能用固定位置猜。
     ========================================================================== */
  function installRawGithubFallback() {
    var RAW_PREFIX = 'https://raw.githubusercontent.com/';
    var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
    if (!nativeFetch) return;

    /** base64（UTF-8）→ 文本。escape 虽已废弃，但这里是处理 UTF-8 的标准写法 */
    function decodeB64Utf8(b64) {
      try {
        return decodeURIComponent(escape(window.atob(String(b64).replace(/\s/g, ''))));
      } catch (err) {
        return null;
      }
    }

    /** 尽量取到登录令牌，避免 API 匿名调用的频率限制 */
    function getToken() {
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          var m = (localStorage.getItem(k) || '').match(/"token"\s*:\s*"([^"]+)"/);
          if (m) return m[1];
        }
      } catch (err) { /* 隐私模式下忽略 */ }
      return null;
    }

    window.fetch = function (input, init) {
      var url = typeof input === 'string' ? input : (input && input.url) || '';

      if (url.indexOf(RAW_PREFIX) !== 0) {
        return nativeFetch(input, init);
      }

      var seg = url.slice(RAW_PREFIX.length).split('/');
      if (seg.length < 4) return nativeFetch(input, init);

      var owner = seg[0], repo = seg[1], branch = seg[2];
      var path = seg.slice(3).join('/');
      var apiUrl = 'https://api.github.com/repos/' + owner + '/' + repo +
                   '/contents/' + path + '?ref=' + branch;

      var headers = { Accept: 'application/vnd.github+json' };
      var token = getToken();
      if (token) headers.Authorization = 'token ' + token;

      if (window.console && console.info) {
        console.info('[raw-gh-fallback] 改写请求 →', apiUrl);
      }

      return nativeFetch(apiUrl, { headers: headers }).then(function (res) {
        if (!res.ok) return res;
        return res.json().then(function (data) {
          var text = decodeB64Utf8(data.content || '');
          if (text === null) {
            return new Response('', { status: 500 });
          }
          return new Response(text, {
            status: 200,
            headers: { 'Content-Type': 'text/plain; charset=utf-8' }
          });
        });
      });
    };
  }

  /* ==========================================================================
     OAuth 兼容层

     背景
     ----
     当前使用的 OAuth Worker 在 /callback 中把「裸 JSON」直接发给主窗口：

         {"token":"gho_xxxxxxxx"}

     而 Decap 期望的是标准格式，并且要求先完成一次握手：

         ① 回调页 → 主窗口：  authorizing:github
         ② 主窗口校验来源后 → 回调页：  authorizing:github     ← 回执
         ③ 回调页收到回执后 → 主窗口：  authorization:github:success:{"token":"...","provider":"github"}

     Decap 内部是这么匹配的：

         if (event.origin === base_url) {
           if (event.data.indexOf('authorization:github:success:') === 0) { 登录成功 }
         }

     裸 JSON 匹配不上，消息会被**静默丢弃**：既不登录，也不报任何错。
     而 ① 没发出，Decap 连结果监听器都不会注册。

     本层做的事
     ----------
     拦截 worker 发来的裸 token JSON，把缺失的握手和前缀补齐后，
     以相同的 origin 重新派发一条标准 message 事件交给 Decap。

     兼容性
     ------
     如果将来把 worker 修好了（发出的是标准格式），本层会原样放行，不做任何干预。
     修好后可以直接删掉这个函数。
     ========================================================================== */
  function installOAuthShim() {
    var PROXY_ORIGIN = 'https://api.flllme.xyz';

    function emit(data, origin) {
      window.dispatchEvent(new MessageEvent('message', { data: data, origin: origin }));
    }

    /** 日志，便于在控制台确认兼容层是否真的介入 */
    function note() {
      if (window.console && console.info) {
        console.info.apply(console, ['[oauth-shim]'].concat([].slice.call(arguments)));
      }
    }

    window.addEventListener('message', function (event) {
      /* 只处理来自 OAuth 代理的消息 */
      if (event.origin !== PROXY_ORIGIN) return;

      var raw = event.data;
      var payload = null;

      if (typeof raw === 'string') {
        var text = raw.trim();
        /* 已经是标准协议格式 → 放行，不干预 */
        if (text.indexOf('authorization:') === 0 || text.indexOf('authorizing:') === 0) return;

        /* 形态一：JSON 文本 */
        try { payload = JSON.parse(text); } catch (err) { payload = null; }

        /* 形态二：直接就是一串裸 token，例如 "gho_xxxxxxxx" */
        if (!payload && /^(gho_|ghp_|ghs_|ghu_|github_pat_)[A-Za-z0-9_]+$/.test(text)) {
          payload = { token: text };
        }

        if (!payload) {
          note('收到无法识别的字符串消息，已忽略：', text.slice(0, 120));
          return;
        }
      } else if (raw && typeof raw === 'object') {
        /* 形态三：worker 直接 postMessage 一个对象（结构化克隆） */
        payload = raw;
      } else {
        return;
      }

      if (!payload) return;

      /* token 字段名容错：有的实现用 access_token */
      var token = payload.token || payload.access_token;
      if (!token) {
        note('消息中找不到 token 字段，已忽略：', payload);
        return;
      }

      payload.token = token;
      if (!payload.provider) payload.provider = 'github';

      /* 第一步：补发握手，让 Decap 注册结果监听器 */
      emit('authorizing:github', event.origin);
      /* 第二步：转发标准格式的结果 */
      emit('authorization:github:success:' + JSON.stringify(payload), event.origin);

      note('已把 worker 的 token 转换为标准格式并补发握手');
    }, true);   // 捕获阶段，尽量先于 Decap 的监听器执行
  }
</script>

<noscript>
  <p style="padding:24px;font-family:sans-serif;">
    内容管理后台需要启用 JavaScript 才能运行。
  </p>
</noscript>

</body>
</html>
