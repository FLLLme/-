<!-- 主题预设：在样式加载前执行，避免深色模式闪白

     ⚠️ 改动本段脚本内任何一个字符（包括空格与换行）后，必须执行
        node tools/csp_hash.js
     并把新哈希更新到 Cloudflare 的 Content-Security-Policy 响应头里。
     本段是内联脚本，CSP 用 SHA-256 哈希白名单放行它；哈希不匹配时它会被
     静默拒绝执行，症状是深色模式下闪一下白 —— 很难联想到 CSP。
     详见 deploy/security-headers.md。 -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('blog.theme');
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

<link rel="stylesheet" href="css/style.css">

<body>
<!-- 背景装饰：右侧的彼岸花线稿（纯装饰，读屏器忽略）
     两点刻意为之：
     1. 两个 <img> 直接挂在 body 下，不套父元素 ——
        父元素若带 position/z-index 会创建独立层叠上下文，
        mix-blend-mode 就只能和空背景混合，白底不会消失。
     2. 用 mix-blend-mode 去掉白底，而不是抠图：
        浅色下 multiply 让白色与背景相乘而「隐形」，只留铅笔线；
        深色下 invert + screen 让黑底隐形，留下白线。
-->
<img class="bg-decor bg-decor-sharp" src="assets/higanbana-line.jpg" alt="" aria-hidden="true" decoding="async">
<img class="bg-decor bg-decor-soft" src="assets/higanbana-line.jpg" alt="" aria-hidden="true" decoding="async">

<header id="siteHeader"></header>

<main>
  <!-- ============ 首屏 ============ -->
  <section class="hero">
    <div class="container hero-inner">
      <h1 class="hero-title">于数字彼岸，<br>记录未见的风景。</h1>
      <p class="hero-sub">文字 / 视觉 / 艺术</p>
      <p class="hero-desc">
        这里存放一些慢下来的东西：关于设计、写作与日常的观察。
        不追热点，不求结论，只把想清楚的部分写下来。
      </p>
      <nav class="hero-links" aria-label="快捷入口">
        <a href="#latest">阅读文章</a>
        <a href="#about">关于我</a>
      </nav>
      <div class="hero-stats" id="heroStats"></div>
    </div>
  </section>

  <div class="container">
    <!-- 离线/加载失败提示 -->
    <div class="offline-banner" id="offlineBanner"></div>

    <!-- ============ 作品集（config.works 为空时整块隐藏）============ -->
    <section class="section" id="worksSection" hidden>
      <h2 class="section-head">作品集</h2>
      <div class="works-grid" id="worksGrid"></div>
    </section>

    <!-- ============ 最新文章 ============ -->
    <section class="section" id="latest">
      <h2 class="section-head">最新文章</h2>

      <!-- 工具栏 -->
      <div class="toolbar" id="tags">
        <label class="search-box" for="searchInput">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="searchInput" placeholder="搜索标题、标签或正文…" autocomplete="off" aria-label="搜索文章">
        </label>
        <div class="tag-filter" id="tagFilter" role="group" aria-label="按标签筛选"></div>
      </div>

      <div class="result-hint" id="resultHint"></div>

      <!-- 文章列表 -->
      <section class="post-grid" id="postGrid" aria-live="polite">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </section>
    </section>

    <!-- ============ 朋友章（config.friends 为空时整块隐藏）============ -->
    <section class="section" id="friendsSection" hidden>
      <h2 class="section-head">朋友章</h2>
      <ul class="friends" id="friendsGrid"></ul>
    </section>

    <!-- ============ 关于 ============ -->
    <section class="section" id="about">
      <h2 class="section-head">关于</h2>
      <p class="about-text">
        未见花是一个人的长期记录。所有文章以 Markdown 源文件存放，
        页面由原生 HTML、CSS 与 JavaScript 驱动，没有框架，也没有构建步骤。
      </p>
    </section>
  </div>
</main>

<footer id="siteFooter"></footer>

<script defer src="js/app.js"></script>
<script defer src="js/md.js"></script>
<script defer src="js/store.js"></script>

<script defer src="posts/bundle.js" onerror="void 0"></script>
<script defer src="js/ai.js"></script>
<script defer src="js/main.js"></script>
</body>
