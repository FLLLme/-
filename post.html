<!-- 主题预设：在样式加载前执行，避免深色模式闪白

     ⚠️ 改动本段脚本内任何一个字符（包括空格与换行）后，必须执行
        node tools/csp_hash.js
     并把新哈希更新到 Cloudflare 的 Content-Security-Policy 响应头里。
     本段是内联脚本，CSP 用 SHA-256 哈希白名单放行它；哈希不匹配时它会被
     静默拒绝执行，症状是深色模式下闪一下白 —— 很难联想到 CSP。
     详见 deploy/security-headers.md。 -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('blog.theme');
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

<!-- 背景装饰：右侧的彼岸花线稿（纯装饰，读屏器忽略）
     两点刻意为之：
     1. 两个 <img> 直接挂在 body 下，不套父元素 ——
        父元素若带 position/z-index 会创建独立层叠上下文，
        mix-blend-mode 就只能和空背景混合，白底不会消失。
     2. 用 mix-blend-mode 去掉白底，而不是抠图：
        浅色下 multiply 让白色与背景相乘而「隐形」，只留铅笔线；
        深色下 invert + screen 让黑底隐形，留下白线。
-->
<img class="bg-decor bg-decor-sharp" src="assets/higanbana-line.jpg" alt="" aria-hidden="true" decoding="async">
<img class="bg-decor bg-decor-soft" src="assets/higanbana-line.jpg" alt="" aria-hidden="true" decoding="async">

<header id="siteHeader"></header>
<div class="reading-progress" id="readingProgress"></div>

<main>
  <div class="container">
    <div class="offline-banner" id="offlineBanner"></div>

    <div class="post-layout" id="postLayout">
      <!-- 正文列 -->
      <article id="articleColumn" hidden>
        <a class="back-link" href="index.html" id="backLink"></a>

        <header class="article-header">
          <div class="post-meta" id="articleMeta"></div>
          <h1 id="articleTitle"></h1>
          <div class="post-tags" id="articleTags"></div>
        </header>

        <div class="article-body" id="articleBody"></div>

        <footer class="article-footer">
          <div class="article-actions">
            <button class="btn" type="button" id="copyLinkBtn"></button>
            <button class="btn" type="button" id="topBtn">回到顶部</button>
            <button class="btn btn-primary" type="button" id="askAiBtn"></button>
          </div>

          <nav class="post-nav" id="postNav"></nav>
        </footer>

        <!-- 评论区 -->
        <section class="comments-section" id="comments">
          <h2 class="section-title" id="commentsTitle"></h2>
          <div id="tcomment"></div>
        </section>
      </article>

      <!-- ============ 侧栏 ============
           整列使用 position: sticky，因此「返回列表」与目录会一直停在
           视口内，无论正文滚到多深都能随时返回。
           窄屏下 .aside-back 转为固定在左下角的悬浮按钮。 -->
      <aside id="tocAside">
        <div class="aside-sticky">
          <a class="aside-back" href="index.html" id="asideBackLink" aria-label="返回文章列表"></a>

          <nav class="toc" id="tocBox" hidden>
            <p class="toc-title">目录</p>
            <ul id="tocList"></ul>
          </nav>
        </div>
      </aside>
    </div>
  </div>
</main>
