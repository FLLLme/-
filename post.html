<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章 · Ink & Logic</title>
<meta name="description" content="文章详情页：Markdown 渲染、目录导航、Twikoo 评论与 DeepSeek AI 问答。">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233d5af1'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">

<script>
  (function () {
    try {
      var t = localStorage.getItem('blog.theme');
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" id="hljs-light" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github.min.css">
<link rel="stylesheet" id="hljs-dark" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css" disabled>
</head>
<body>

<header id="siteHeader"></header>
<div class="reading-progress" id="readingProgress"></div>

<main>
  <div class="container">
    <div class="offline-banner" id="offlineBanner"></div>

    <div class="post-layout" id="postLayout">
      <!-- 正文列 -->
      <article id="articleColumn" hidden>
        <a class="back-link" href="index.html" id="backLink"></a>

        <header class="article-header">
          <div class="post-meta" id="articleMeta"></div>
          <h1 id="articleTitle"></h1>
          <div class="post-tags" id="articleTags" style="border-top:0;padding-top:0;"></div>
        </header>

        <div class="article-body" id="articleBody"></div>

        <footer class="article-footer">
          <div class="article-actions">
            <button class="btn" type="button" id="copyLinkBtn"></button>
            <button class="btn" type="button" id="topBtn">回到顶部</button>
            <button class="btn btn-primary" type="button" id="askAiBtn"></button>
          </div>

          <nav class="post-nav" id="postNav"></nav>
        </footer>

        <!-- 评论区 -->
        <section class="comments-section" id="comments">
          <h2 class="section-title" id="commentsTitle"></h2>
          <div id="tcomment"></div>
        </section>
      </article>

      <!-- 目录侧栏 -->
      <aside id="tocAside">
        <nav class="toc" id="tocBox" hidden>
          <p class="toc-title">目录</p>
          <ul id="tocList"></ul>
        </nav>
      </aside>
    </div>
  </div>
</main>

<footer id="siteFooter"></footer>

<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>

<script defer src="js/config.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/md.js"></script>
<script defer src="js/store.js"></script>
<script defer src="posts/bundle.js" onerror="void 0"></script>
<script defer src="js/ai.js"></script>
<script defer src="js/post.js"></script>
</body>
</html>
