<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沙盒造物笔记 · 未见花</title>
<meta name="description" content="SimplePlanes 2 的反编译与数值拟合笔记">
<style>
/* ==========================================================================
   两套颜色刻意并存，各管一块：

   · --m-* 是主站的暖白 / 朱砂红，只用于顶部导航栏 —— 让这一栏与主站完全一致，
     读者一眼就知道还在「未见花」里；
   · 下面的冷灰 / 蓝主色沿用这三篇文档自身的设计，只用于正文区。

   导航是「站点外框」，正文是「文档内容」。两者分工明确，比强行统一一套配色更耐看。
   ========================================================================== */
:root{
  /* 主站令牌（与 css/style.css 的 :root 逐一对应） */
  --m-bg:#FAFAFA; --m-text:#333333; --m-line:#E5E5E5; --m-accent:#DC143C;
  --m-text-soft:#6E6E6E; --m-header-h:68px; --m-wrap:1060px;

  /* 文档令牌（与三篇笔记的 :root 一致） */
  --bg:#f5f6f8; --surface:#ffffff; --surface-alt:#f0f2f5;
  --text:#1f2329; --text-sub:#555e6b; --text-mute:#8a929c;
  --border:#e2e5ea; --accent:#2563eb; --accent-soft:#eaf1ff;
  --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}

/* ---------- 顶部导航：逐项照抄主站 .site-header ---------- */
.mh{
  position:sticky; top:0; z-index:60;
  background:rgba(250,250,250,.86);
  backdrop-filter:saturate(1.6) blur(14px);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--m-line);
}
.mh-inner{
  max-width:var(--m-wrap); margin:0 auto; padding:0 24px;
  display:flex; align-items:center; gap:20px; height:var(--m-header-h);
}
.mbrand{display:inline-flex; align-items:center; gap:10px; flex:none; text-decoration:none}
.mbrand-mark{display:inline-flex; flex:none; width:26px; height:26px; color:var(--m-accent)}
.mbrand-mark svg{width:100%; height:100%}
.mbrand-name{
  font-family:"Kaiti SC","STKaiti","KaiTi","楷体",Georgia,serif;
  font-size:20px; font-weight:500; letter-spacing:.1em; line-height:1;
  color:var(--m-text); transition:color .2s;
}
.mbrand:hover .mbrand-name{color:var(--m-accent)}

.mnav{display:flex; align-items:center; margin-left:auto}
.mnav a{
  position:relative; padding:6px 13px; font-size:14.5px; color:var(--m-text-soft);
  text-decoration:none; transition:color .2s;
}
.mnav a:hover{color:var(--m-text)}
.mnav a:not(:first-child)::before{
  content:'/'; position:absolute; left:-3px; color:var(--m-line); pointer-events:none;
}
.mnav a.active{color:var(--m-accent)}
.mnav a.active::after{
  content:''; position:absolute; left:13px; right:13px; bottom:-3px;
  height:1.5px; background:var(--m-accent);
}

/* ---------- 正文区：沿用文档的冷灰体系 ---------- */
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.75; font-size:15px;
  -webkit-font-smoothing:antialiased; padding-bottom:60px;
}
.wrap{max-width:920px; margin:0 auto; padding:0 20px}

.pagehead{padding:34px 0 18px}
.pagehead h1{font-size:26px; font-weight:700; letter-spacing:.3px; line-height:1.35; color:var(--text)}
.pagehead .sub{font-size:13.5px; color:var(--text-sub); margin-top:6px}
.pagehead .tags{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
.pagehead .tag{background:var(--accent-soft); border:1px solid #cfe0ff; color:var(--accent);
  padding:3px 10px; border-radius:20px; font-size:12px}

.intro{color:var(--text-sub); font-size:14px; margin-bottom:18px}

/* 笔记列表 */
.notes{list-style:none; display:flex; flex-direction:column; gap:12px}
.note{display:block; text-decoration:none; color:inherit; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:18px 22px; transition:transform .15s,box-shadow .15s,border-color .15s;
  position:relative; overflow:hidden}
.note::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--accent); transform:scaleY(0); transform-origin:top; transition:transform .2s}
.note:hover{transform:translateY(-2px); border-color:#cfe0ff;
  box-shadow:0 2px 6px rgba(0,0,0,.07),0 10px 26px rgba(37,99,235,.10)}
.note:hover::before{transform:scaleY(1)}
.note .t{font-size:16px; font-weight:650; line-height:1.5; color:var(--text)}
.note .meta{display:flex; align-items:center; gap:8px; margin-top:6px;
  font-size:12px; color:var(--text-mute)}
.note .kind{background:var(--surface-alt); border:1px solid var(--border);
  padding:1px 7px; border-radius:5px; font-size:11px}
.note .arrow{margin-left:auto; color:var(--accent); font-size:15px; opacity:0; transition:opacity .2s}
.note:hover .arrow{opacity:1}

.state{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:28px 24px; text-align:center; color:var(--text-mute); font-size:14px}
.state b{display:block; color:var(--text-sub); font-size:15px; margin-bottom:4px}

footer{text-align:center; color:var(--text-mute); font-size:12px; margin-top:36px;
  padding-top:18px; border-top:1px solid var(--border)}

/* ---------- 窄屏：与主站同一套处理方式 ---------- */
@media(max-width:720px){
  .mh-inner{padding:0 18px; height:60px}
  .mbrand-name{font-size:18px; letter-spacing:.08em}
  .mbrand-mark{width:23px; height:23px}
  .mnav a{padding:6px 9px; font-size:13.5px}
  .mnav a:not(:first-child)::before{left:-2px}
  .mnav a.active::after{left:9px; right:9px}
  /* 5 个标签在 375px 上放不平，改为不换行 + 横向滚动；
     padding-bottom 是给选中下划线（定位在 bottom:-3px）留位置，
     否则一加 overflow 就会被裁掉 */
  .mnav{flex:0 1 auto; min-width:0; overflow-x:auto; overflow-y:hidden;
    padding-bottom:5px; scrollbar-width:none; -ms-overflow-style:none}
  .mnav::-webkit-scrollbar{display:none}
  .mnav a{flex:0 0 auto; white-space:nowrap}

  .pagehead{padding:26px 0 14px}
  .pagehead h1{font-size:21px}
  .note{padding:15px 17px}
  .note .t{font-size:15px}
  body{font-size:14px}
}
</style>
</head>
